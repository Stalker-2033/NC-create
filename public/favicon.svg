<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="50%" stop-color="#00c880" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb74d" />
      <stop offset="100%" stop-color="#f57c00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="48" height="48" rx="12" fill="#080915" />
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="url(#g1)" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- Cogwheel & Cube -->
  <g transform="translate(24, 24)" filter="url(#glow)">
    <circle r="12" stroke="url(#gearGrad)" stroke-width="3" stroke-dasharray="4 2.5" />
    <circle r="6" fill="#0c1024" stroke="url(#g1)" stroke-width="2" />
    <path d="M-3 -3 L3 3 M-3 3 L3 -3" stroke="#00f5a0" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
